name: Bug report
description: Report a bug or incorrect behaviour in midnight-faucet-ui
title: "[Bug] "
type: Bug
labels:
  - status:untriaged
  - component:faucet
body:
  - type: input
    id: version
    attributes:
      label: Version affected
      description: Release tag, deployed environment, or commit SHA where the bug occurs.
      placeholder: e.g. v1.4.0 / preview / commit abc1234
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Browser & OS
      description: Browser and version, operating system, and wallet extension if relevant.
      placeholder: e.g. Chrome 141 on macOS 15, Lace 1.9
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
      description: If not reproducible, describe the steps as best you recall.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: The outcome you saw. Include console errors or screenshots, with secrets removed.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What you expected to happen instead.
    validations:
      required: true
